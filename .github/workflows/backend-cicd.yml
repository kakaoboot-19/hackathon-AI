name: FastAPI Docker Deploy to EC2

on:
  push:
    branches:
      - feature/testcodeV2

jobs:
  build: # Docker Image Build & Push
    runs-on: ubuntu-latest

    outputs:
      tag: ${{ steps.tag.outputs.version }}  

    steps:
      # 1. Code Checkout
      - name: Checkout Code
        uses: actions/checkout@v4

      # 2. Create Image Tag
      - name: Generate image Tag
        id: tag
        run: |
          SHORT_SHA=$(echo ${{ github.sha }} | cut -c1-7)
          VERSION="v$(date +%Y%m%d)-${SHORT_SHA}"
          echo "version=${VERSION}" >> $GITHUB_OUTPUT
          echo "Generated tag: ${VERSION}"
      
      # 3. Docker Hub Login
      - name: Login to Docker Hub
        run: |
          echo "${{ secrets.DOCKERHUB_TOKEN }}" | docker login -u "${{ secrets.DOCKERHUB_USERNAME }}" --password-stdin

      # 4. Docker Image Build & Push
      - name: Build and Push Docker Image
        run: |
          IMAGE_NAME="jmin99/ai"  
          IMAGE_TAG="${{ steps.tag.outputs.version }}"
          
          docker build --platform linux/amd64 \
            -t ${IMAGE_NAME}:${IMAGE_TAG} \
            -t ${IMAGE_NAME}:latest .
          
          docker push ${IMAGE_NAME}:${IMAGE_TAG}
          docker push ${IMAGE_NAME}:latest
          
          echo "Image: ${IMAGE_NAME}:${IMAGE_TAG}"

  deploy:
    needs: build
    runs-on: ubuntu-latest
    
    steps:
      - name: Deploy to EC2 via SSH
        uses: appleboy/ssh-action@v1.0.0

        env:
          IMAGE_TAG: ${{ needs.build.outputs.tag }}
        
        with:
          host: ${{ secrets.EC2_HOST }}
          username: ${{ secrets.EC2_USER }}
          key: ${{ secrets.EC2_SSH_KEY }}
          port: 22
          envs: IMAGE_TAG 

          script: |
            IMAGE_NAME="jmin99/ai" 
            
            echo "Image: ${IMAGE_NAME}:${IMAGE_TAG}"
            
            docker pull ${IMAGE_NAME}:${IMAGE_TAG}
            docker pull ${IMAGE_NAME}:latest
            
            docker compose down || true
            
            export IMAGE_TAG=${IMAGE_TAG}
            docker compose up -d
            
            docker compose ps
            
            # 이전 이미지 정리 (최신 3개 버전만 유지)
            docker images ${IMAGE_NAME} --format "{{.Tag}}" | \
              grep -v "latest" | \
              tail -n +6 | \
              xargs -r -I {} docker rmi ${IMAGE_NAME}:{} || true